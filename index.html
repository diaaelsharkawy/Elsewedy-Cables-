<title>IIoT Platform Decision Briefing</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600;700;800&family=Carlito:ital,wght@0,400;0,700;1,400&display=swap">
<style>
/* Layout: Elsewedy template chrome (logo chip + red header band + red footer rule) around one interactive slide at a time; overview grid on demand. */
:root{
  --red:#C00000; --red-ink:#A30000; --red-soft:#FBE9E9;
  --ink:#1D1F23; --muted:#5B6068; --line:#E1E3E7;
  --paper:#FFFFFF; --panel:#F3F4F6; --panel-2:#E9EBEE;
  --met:#17734F; --met-soft:#E3F3EC;
  --part:#A65F00; --part-soft:#FCF0DC;
  --gap:#C00000; --gap-soft:#FBE9E9;
  --bar-ink:#FFFFFF;
  --f-display:'Barlow Semi Condensed','Arial Narrow',Arial,sans-serif;
  --f-body:'Carlito',Calibri,'Segoe UI',Arial,sans-serif;
  --r:10px; --band:#C00000; --band-deep:#7A0000;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --red:#E0393E; --red-ink:#FF6B6E; --red-soft:#3A1C1E;
  --ink:#ECEDEF; --muted:#A6ABB3; --line:#33363C;
  --paper:#16171A; --panel:#1F2125; --panel-2:#2A2D32;
  --met:#4CC497; --met-soft:#173328; --part:#F0A93B; --part-soft:#3A2C14; --gap:#FF6B6E; --gap-soft:#3A1C1E;
  --bar-ink:#FFFFFF; color-scheme:dark}}
:root[data-theme="dark"]{
  --red:#E0393E; --red-ink:#FF6B6E; --red-soft:#3A1C1E;
  --ink:#ECEDEF; --muted:#A6ABB3; --line:#33363C;
  --paper:#16171A; --panel:#1F2125; --panel-2:#2A2D32;
  --met:#4CC497; --met-soft:#173328; --part:#F0A93B; --part-soft:#3A2C14; --gap:#FF6B6E; --gap-soft:#3A1C1E;
  --bar-ink:#FFFFFF; color-scheme:dark}

[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:18px;line-height:1.45;display:flex;flex-direction:column}
*{box-sizing:border-box}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.08}
p,ul,ol{margin:0}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--red);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}

/* chrome */
.top{display:flex;align-items:stretch;min-height:64px;position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--paper)}
.logo{background:#FFFFFF;display:flex;align-items:center;padding:6px 18px;border-bottom:1px solid var(--line)}
.logo img{height:46px;width:auto;display:block}
.band{flex:1;background:var(--band);color:var(--bar-ink);display:flex;align-items:center;gap:16px;padding:0 16px 0 24px;min-width:0}
.band h2{font-size:clamp(20px,2.4vw,30px);font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;min-width:0}
.band .count{font-family:var(--f-display);font-weight:600;font-size:18px;opacity:.9;white-space:nowrap}
.iconbtn{background:transparent;border:1px solid rgba(255,255,255,.55);color:#FFFFFF;border-radius:8px;padding:6px 12px;font-size:15px;font-weight:700;white-space:nowrap}
.iconbtn:hover{background:rgba(255,255,255,.14)}
.progress{height:4px;background:var(--panel-2)}
.progress i{display:block;height:100%;background:var(--red);transition:width .3s}

main{flex:1;min-height:0;overflow:auto;padding-block:28px 24px;padding-inline:clamp(16px,4vw,64px)}
.slide{max-width:1240px;margin-inline:auto;display:flex;flex-direction:column;gap:22px;animation:in .35s ease}
@keyframes in{from{transform:translateY(8px)}to{transform:none}}
@media (prefers-reduced-motion:reduce){.slide{animation:none}.progress i{transition:none}}
.kicker{font-family:var(--f-display);font-weight:600;letter-spacing:.12em;text-transform:uppercase;font-size:14px;color:var(--red-ink)}
.lead{font-size:clamp(28px,3.4vw,44px);font-weight:700}
.sub{color:var(--muted);font-size:19px;max-width:70ch}
.src{font-size:14px;color:var(--muted);border-top:1px solid var(--line);padding-top:10px;margin-top:4px}
.src b{color:var(--ink)}

.foot{display:flex;align-items:center;gap:12px;padding:10px clamp(16px,4vw,64px) calc(10px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);background:var(--paper)}
.foot .rule{width:110px;height:5px;background:var(--red);flex:none}
.dots{display:flex;gap:6px;flex-wrap:wrap;flex:1;justify-content:center}
.dots button{width:12px;height:12px;border-radius:50%;border:none;background:var(--panel-2);padding:0}
.dots button[aria-current="true"]{background:var(--red)}
.navbtn{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:8px 16px;font-weight:700}
.navbtn:hover{border-color:var(--red)}
.www{font-size:12px;letter-spacing:.35em;color:var(--muted);white-space:nowrap}
@media (max-width:760px){.www{display:none}.dots{display:none}.foot .rule{width:48px}}

/* generic */
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
@media (max-width:900px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:1fr}}
@media (max-width:640px){.g2,.g4{grid-template-columns:1fr}}
.tile{background:var(--panel);border-radius:var(--r);padding:20px;display:flex;flex-direction:column;gap:6px;min-width:0;border:1px solid transparent;text-align:left}
button.tile:hover{border-color:var(--red)}
.big{font-family:var(--f-display);font-weight:800;font-size:clamp(40px,5vw,64px);line-height:1}
.tile h3{font-size:22px}
.tile p{color:var(--muted);font-size:16px}
.more{font-size:14px;font-weight:700;color:var(--red-ink);margin-top:auto}
.callout{background:var(--ink);color:var(--paper);border-radius:var(--r);padding:20px 24px;font-size:19px}
.callout b{color:var(--paper)}
.warn{background:var(--part-soft);border-left:6px solid var(--part);border-radius:6px;padding:16px 20px}
.pill{display:inline-flex;align-items:center;gap:6px;font-weight:700;font-size:14px;border-radius:999px;padding:3px 10px;white-space:nowrap}
.pill::before{content:"";width:8px;height:8px;border-radius:50%;background:currentColor}
.s-met{color:var(--met);background:var(--met-soft)}
.s-part{color:var(--part);background:var(--part-soft)}
.s-gap{color:var(--gap);background:var(--gap-soft)}

/* cover */
.cover{max-width:1240px;margin-inline:auto;border-radius:14px;overflow:hidden;background:var(--band);color:#FFFFFF;display:grid;grid-template-columns:1.25fr 1fr;min-height:min(70vh,620px)}
.cover .l{padding:clamp(24px,4vw,56px);display:flex;flex-direction:column;justify-content:space-between;gap:28px}
.cover h1{font-size:clamp(40px,5.6vw,80px);font-weight:800}
.cover .tag{font-family:var(--f-display);letter-spacing:.14em;text-transform:uppercase;font-weight:600;font-size:15px;opacity:.9}
.cover .meta{font-size:17px;opacity:.92}
.cover .r{background:var(--band-deep);padding:clamp(24px,3vw,40px);display:flex;flex-direction:column;justify-content:center;gap:18px}
.cover .r .k{display:flex;align-items:baseline;gap:14px;border-bottom:1px solid rgba(255,255,255,.25);padding-bottom:12px}
.cover .r .k b{font-family:var(--f-display);font-size:44px;font-weight:800;min-width:110px}
.cover .r .k span{font-size:17px;opacity:.95}
.startbtn{align-self:flex-start;background:#FFFFFF;color:#A30000;border:none;border-radius:8px;padding:12px 22px;font-weight:700;font-size:17px}
@media (max-width:820px){.cover{grid-template-columns:1fr}}

/* requirements explorer */
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.chip{border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:6px 14px;font-weight:700;font-size:15px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.stack{display:flex;height:34px;border-radius:8px;overflow:hidden;font-weight:700;font-size:15px}
.stack span{display:flex;align-items:center;padding-left:12px;color:#FFFFFF;white-space:nowrap;overflow:hidden}
.explorer{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.25fr);gap:18px;align-items:start}
@media (max-width:900px){.explorer{grid-template-columns:1fr}}
.reqlist{display:flex;flex-direction:column;gap:6px;max-height:min(58vh,560px);overflow:auto;padding-right:4px}
.req{display:flex;align-items:center;gap:10px;justify-content:space-between;border:1px solid var(--line);background:var(--paper);border-radius:8px;padding:10px 12px;text-align:left}
.req .t{font-weight:700;font-size:16px;min-width:0}
.req .g{font-size:13px;color:var(--muted);display:block;font-weight:400}
.req[aria-selected="true"]{border-color:var(--red);box-shadow:inset 4px 0 0 var(--red)}
.detail{background:var(--panel);border-radius:var(--r);padding:22px;display:flex;flex-direction:column;gap:16px;min-width:0}
.detail h3{font-size:28px}
.cmp{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (max-width:640px){.cmp{grid-template-columns:1fr}}
.cmp div{background:var(--paper);border-radius:8px;padding:14px;display:flex;flex-direction:column;gap:6px}
.cmp h4{margin:0;font-family:var(--f-display);font-size:15px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.ref{font-size:13px;color:var(--muted)}
.action{border-left:5px solid var(--red);padding:4px 0 4px 14px}

/* architecture */
.layers{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
@media (max-width:900px){.layers{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:520px){.layers{grid-template-columns:1fr}}
.layer{position:relative;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px;text-align:left;display:flex;flex-direction:column;gap:6px}
.layer .n{font-family:var(--f-display);font-weight:800;color:var(--red-ink);font-size:18px}
.layer h3{font-size:22px}
.layer p{font-size:15px;color:var(--muted)}
.layer[aria-pressed="true"]{border-color:var(--red);background:var(--red-soft)}
.panel{background:var(--panel);border-radius:var(--r);padding:20px;display:flex;flex-direction:column;gap:10px}
.panel ul{padding-left:20px;display:flex;flex-direction:column;gap:4px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:none;background:var(--paper);padding:8px 14px;font-weight:700;font-size:15px}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}

/* timeline */
.tl{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--paper)}
.tlin{min-width:820px;display:grid;grid-template-columns:200px repeat(20,minmax(0,1fr));position:relative;padding:12px 12px 44px}
.tlin .wk{font-size:12px;color:var(--muted);text-align:center;padding-bottom:6px;border-bottom:1px solid var(--line)}
.tlin .lab{font-weight:700;font-size:15px;padding:8px 8px 8px 0;grid-column:1}
.bar{height:26px;align-self:center;border-radius:5px;background:var(--ink);opacity:.85}
.bar.alt{background:var(--muted)}
.bar.red{background:var(--red);opacity:1}
.gate{position:absolute;top:34px;bottom:40px;width:0;border-left:2px dashed var(--muted)}
.gate button{position:absolute;bottom:-32px;left:-22px;width:44px;border:none;border-radius:6px;background:var(--ink);color:var(--paper);font-weight:700;font-size:13px;padding:3px 0}
.gate button[aria-pressed="true"]{background:var(--red);color:#FFFFFF}
.limit{position:absolute;top:28px;bottom:40px;border-left:4px solid var(--red)}
.limit span{position:absolute;top:-4px;left:6px;background:var(--red);color:#FFFFFF;font-size:12px;font-weight:700;padding:2px 6px;border-radius:4px;white-space:nowrap}

/* commercial */
.range{display:flex;flex-direction:column;gap:6px}
.range label{font-weight:700}
input[type=range]{width:100%;accent-color:var(--red)}
.pay{display:flex;flex-direction:column;gap:8px}
.payrow{display:grid;grid-template-columns:210px minmax(0,1fr) 70px;gap:10px;align-items:center;font-size:15px}
@media (max-width:560px){.payrow{grid-template-columns:120px minmax(0,1fr) 56px;font-size:13px}}
.payrow .b{height:26px;border-radius:5px;background:var(--muted);transition:width .35s}
.payrow .b.pre{background:var(--red)}
.payrow .v{font-weight:700;text-align:right}
table{border-collapse:collapse;width:100%;font-size:16px}
th,td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-family:var(--f-display);font-size:14px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
td.r,th.r{text-align:right}
tr.tot td{font-weight:700;background:var(--panel)}
.tablewrap{overflow-x:auto}

/* risks */
.matrix{display:grid;grid-template-columns:40px repeat(3,minmax(0,1fr));grid-template-rows:repeat(3,minmax(84px,auto)) 34px;gap:6px}
.cell{background:var(--panel);border-radius:8px;padding:8px;display:flex;flex-wrap:wrap;gap:6px;align-content:flex-start}
.cell.hot{background:var(--gap-soft)}
.cell.warm{background:var(--part-soft)}
.ax{font-size:12px;color:var(--muted);display:flex;align-items:center;justify-content:center;text-align:center}
.ax.v{writing-mode:vertical-rl;transform:rotate(180deg)}
.rdot{border:none;border-radius:999px;background:var(--ink);color:var(--paper);font-weight:700;font-size:14px;padding:4px 10px}
.rdot[aria-pressed="true"]{background:var(--red);color:#FFFFFF}

/* decisions */
.dechead{display:grid;grid-template-columns:52px minmax(0,1.3fr) minmax(0,1fr);gap:16px;padding:0 18px 0 24px;font-family:var(--f-display);font-size:14px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.dec{display:grid;grid-template-columns:52px minmax(0,1.3fr) minmax(0,1fr);gap:16px;align-items:start;background:var(--panel);border-radius:var(--r);padding:16px 18px;border-left:6px solid var(--line)}
.dec[data-s="Approved"]{border-left-color:var(--met)}
.dec[data-s="Needs discussion"]{border-left-color:var(--part)}
.dec[data-s="Not approved"]{border-left-color:var(--gap)}
.md{display:flex;flex-direction:column;gap:8px;min-width:0}
.md .seg{display:flex}
.md .seg button{flex:1;padding:8px 6px;font-size:14px}
.md textarea{width:100%;min-height:64px;resize:vertical;border:1px solid var(--line);border-radius:8px;background:var(--paper);color:var(--ink);font:inherit;font-size:16px;padding:8px 10px}
.md textarea:focus-visible{outline:3px solid var(--red);outline-offset:1px}
.md label{font-size:13px;font-weight:700;color:var(--muted)}
.decbar{display:flex;gap:12px;align-items:center;flex-wrap:wrap;justify-content:space-between}
@media (max-width:760px){.dechead{display:none}.dec{grid-template-columns:44px minmax(0,1fr)}.dec .md{grid-column:1 / -1}}
.dec .n{font-family:var(--f-display);font-weight:800;font-size:40px;color:var(--red-ink);line-height:1}
.dec p{font-size:18px}
.dec small{display:block;color:var(--muted);font-size:14px;margin-top:4px}
.seg button.ap[aria-pressed="true"]{background:var(--met);color:#FFFFFF}
.seg button.di[aria-pressed="true"]{background:var(--part);color:#FFFFFF}
.seg button.de[aria-pressed="true"]{background:var(--gap);color:#FFFFFF}

/* concerns + mitigation */
.refsgrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.7fr);gap:16px;align-items:start}
@media (max-width:900px){.refsgrid{grid-template-columns:1fr}}
.concern{background:var(--paper);border:1px solid var(--line);border-radius:8px}
.concern[open]{border-color:var(--gap)}
.concern summary{list-style:none;cursor:pointer;display:flex;gap:10px;align-items:center;justify-content:space-between;padding:12px 14px;font-weight:700}
.concern summary::-webkit-details-marker{display:none}
.concern summary::after{content:"+";font-family:var(--f-display);font-size:22px;color:var(--red-ink);line-height:1}
.concern[open] summary::after{content:"–"}
.concern summary:focus-visible{outline:3px solid var(--red);outline-offset:2px}
.concern .body{padding:0 14px 14px;display:flex;flex-direction:column;gap:8px}
.concern ul{padding-left:20px;display:flex;flex-direction:column;gap:4px;font-size:16px}
.when{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;border-radius:999px;padding:3px 9px;white-space:nowrap;background:var(--panel-2);color:var(--ink)}
.cmpcol{color:var(--met);font-weight:700}
td.tg,th.tg{background:var(--met-soft)}

/* overview */
.overview{max-width:1240px;margin-inline:auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.ov{border:1px solid var(--line);background:var(--panel);border-radius:var(--r);padding:16px;text-align:left;display:flex;flex-direction:column;gap:6px;min-height:110px}
.ov:hover{border-color:var(--red)}
.ov b{font-family:var(--f-display);color:var(--red-ink);font-size:24px}
.ov span{font-weight:700}
.keys{font-size:13px;color:var(--muted)}

.lockscr{flex:1;display:flex;align-items:center;justify-content:center;padding-block:32px;padding-inline:16px}
.gcard{width:100%;max-width:440px;background:var(--panel);border-radius:14px;overflow:hidden;box-shadow:0 10px 40px rgba(0,0,0,.12)}
.gtop{display:flex;align-items:stretch}
.gtop .logo{border:none}
.gtop .gband{flex:1;background:var(--band)}
.gbody{padding:28px;display:flex;flex-direction:column;gap:14px}
.gbody h1{font-size:32px}
.gbody p{color:var(--muted);font-size:16px}
.gbody label{font-weight:700;font-size:15px}
.gbody input{font:inherit;font-size:28px;letter-spacing:.35em;text-align:center;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--paper);color:var(--ink);width:100%;font-variant-numeric:tabular-nums}
.gbody input:focus-visible{outline:3px solid var(--red);outline-offset:1px}
.gbtn{background:var(--band);color:#FFFFFF;border:none;border-radius:8px;padding:12px;font-weight:700;font-size:17px}
.gbtn[disabled]{opacity:.6;cursor:progress}
.gerr{color:var(--gap)!important;font-weight:700;min-height:1.4em}
</style>

<script>
(function(){
  const P=JSON.parse(document.getElementById('payload').textContent);
  const u8=b=>Uint8Array.from(atob(b),c=>c.charCodeAt(0));
  let fails=0;
  document.getElementById('pin').focus();
  document.getElementById('gform').addEventListener('submit',async e=>{
    e.preventDefault();

    btn.disabled=true;btn.textContent='Checking…';err.textContent='';
    try{
      if(!(window.crypto&&crypto.subtle))throw new Error('nocrypto');
      const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(pin),'PBKDF2',false,['deriveKey']);
      const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:u8(P.s),iterations:P.n,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['decrypt']);
      const html=new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:u8(P.i)},key,u8(P.c)));
      const tpl=document.createElement('template');tpl.innerHTML=html;
      const scripts=Array.from(tpl.content.querySelectorAll('script'));scripts.forEach(s=>s.remove());
      document.getElementById('gate').replaceWith(tpl.content);
      scripts.forEach(s=>{const n=document.createElement('script');n.textContent=s.textContent;document.body.appendChild(n)});
    }catch(x){
      fails++;
      err.textContent=x.message==='nocrypto'?'This browser cannot open protected pages. Try a current version of Chrome, Edge or Safari.':'Incorrect PIN. Please try again.';
      const wait=Math.min(30,fails>=3?(fails-2)*5:0);
      if(wait){let t=wait;btn.textContent='Wait '+t+'s';const iv=setInterval(()=>{t--;btn.textContent=t>0?'Wait '+t+'s':'Open briefing';if(t<=0){clearInterval(iv);btn.disabled=false}},1000)}
      else{btn.disabled=false;btn.textContent='Open briefing'}
      document.getElementById('pin').select();
    }
  });
})();
</script>
